aid: humans-and
name: Humans&
description: Humans& (humansand.ai) is a human-centric frontier AI lab, publicly announced January
  20, 2026, that aims to reimagine artificial intelligence around people and their relationships with
  one another rather than autonomy alone. The team focuses on long-horizon and multi-agent reinforcement
  learning, memory, and user understanding, tightly integrating scientific research with product
  development. Its founding team has led major efforts across frontier industry and academic labs
  including xAI, Anthropic, Google DeepMind, OpenAI, Meta, Reflection, AI2, Stanford, and MIT. The seed
  round is led by SV Angel and co-founder Georges Harik, with investors including NVIDIA, Jeff Bezos, GV
  (Google Ventures), Emerson Collective, Forerunner, S32, DCVC, Bloomberg Beta, and many others. As of
  this profile the company is in a pre-product announcement phase with no public developer API, SDKs, or
  developer portal; it publishes a research blog and intends to contribute back to open source and
  academic research.
